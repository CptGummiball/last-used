name: Version request
description: Ask for Last Used on a Minecraft version or loader that is not supported yet.
title: "[Version request] Minecraft "
labels: ["version request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! Last Used is made and tested for **Minecraft 26.3**, for **Fabric and NeoForge**.
        Every new version means a full test round (client, dedicated server, all automated game tests, multiplayer
        join checks), so requests with a real use help decide what comes next.

        Please check the [open version requests](https://github.com/CptGummiball/last-used/issues?q=is%3Aissue+label%3A%22version+request%22)
        first: if your version is already asked for, give that issue a :+1: instead of opening a new one.

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      description: "The exact version you would like, e.g. 1.21.11 or 26.4."
      placeholder: "26.4"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      multiple: true
      options:
        - Fabric
        - NeoForge
        - Other (write it below)
    validations:
      required: true

  - type: dropdown
    id: use
    attributes:
      label: Where would you use it?
      options:
        - In a public modpack
        - In a private modpack / with friends
        - On a server
        - Singleplayer
        - Other
    validations:
      required: true

  - type: input
    id: pack
    attributes:
      label: Modpack or server (optional)
      description: "A link or name helps to see which other mods Last Used has to work with on that version."
      placeholder: "https://www.curseforge.com/minecraft/modpacks/..."

  - type: textarea
    id: why
    attributes:
      label: Why this version?
      description: "For example, your pack cannot move to a supported version because a key mod is missing there."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the open version requests, and this version is not asked for yet.
          required: true
        - label: I understand that a request is not a promise.
          required: true
