name: Mod compatibility
description: Another mod's tooltips or items do not work together with Last Used.
labels: ["compatibility", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Last Used adds its tooltip line through the standard tooltip events of Fabric and NeoForge and never changes other lines. Tell us which mod's tooltip or item use misbehaves.

        Known limits, no need to report: see the wiki (Supported Versions, FAQ).

  - type: input
    id: othermod
    attributes:
      label: Other mod and version
      placeholder: "ExampleMod 2.3.1"
    validations:
      required: true

  - type: input
    id: block
    attributes:
      label: Block or machine
      description: Which block of that mod? (name, and the id if you know it, e.g. from F3)
      placeholder: "Example Furnace (examplemod:furnace)"
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "other (write it below)"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Last Used jar and loader version
      placeholder: "lastused-1.0.0+mc1.21.1-neoforge.jar, NeoForge 21.1.252"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - It does not connect / interact at all
        - It interacts, but wrongly
        - Resources are lost or duplicated
        - Crash
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details and steps to reproduce
      description: What exactly did you do? Does it work with a vanilla block in the same place? Screenshots help.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`logs/latest.log` (drag and drop, or a paste link), and a crash report if there was one."
